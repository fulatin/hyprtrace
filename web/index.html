<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2306b6d4'/><path d='M6 20l5-8 4 5 3-4 8 7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>HyprTrace — Window Time Tracker</title>
    <script>
      // Applied before first paint so a light-theme user never sees a dark flash.
      (function () {
        try {
          var p = localStorage.getItem('hyprtrace.theme') || 'system';
          var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var t = p === 'system' ? (m ? 'light' : 'dark') : p;
          var r = document.documentElement;
          r.classList.add(t);
          r.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
