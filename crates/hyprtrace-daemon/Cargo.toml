[package]
name = "hyprtrace-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
hyprland = "0.4.0-beta.3"
rusqlite = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
evdev = "0.13"