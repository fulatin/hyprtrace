[package]
name = "hyprtrace-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
hyprland = "0.4.0-beta.3"
# `bundled` compiles SQLite from source instead of linking the system
# library: it guarantees the FTS5 module the global search needs and keeps
# the SQLite version identical across distributions (and in CI).
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
evdev = "0.13"
procfs = "0.16"
hyprtrace-common = { path = "../hyprtrace-common" }