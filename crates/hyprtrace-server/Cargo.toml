[package]
name = "hyprtrace-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source instead of linking the system
# library: it guarantees the FTS5 module the global search needs and keeps
# the SQLite version identical across distributions (and in CI).
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
directories = "5"
hyprtrace-common = { path = "../hyprtrace-common" }
tower-http = { version = "0.5", features = ["fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
hyprland = "0.4.0-beta.3"
ts-rs = "12.0.1"
