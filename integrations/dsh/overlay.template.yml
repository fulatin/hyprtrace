- id: skill-office
  disabled: true

- insert:
    # Live-streaming bridge between the harness and hyprtrace-server. It is a
    # local ESM plugin; the export default `apply(ctx)` is the plugin.
    - id: hyprtrace-bridge
      name: 'file://{{BRIDGE_SCRIPT}}'

    - id: mcp-hyprtrace
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: hyprtrace
        transport: stdio
        command: node
        # Single-quoted YAML scalar: escape `'` inside the substituted path as `''`.
        args: ['{{TOOLS_SCRIPT}}']
        # dsh scrubs ambient *TOKEN*/*KEY* names before spawning the MCP child,
        # so the values are passed through explicitly here.
        env:
          HYPRTRACE_API_BASE: !!js "process.env.HYPRTRACE_API_BASE ?? 'http://127.0.0.1:9420'"
          HYPRTRACE_AUTH_TOKEN: !!js "process.env.HYPRTRACE_AUTH_TOKEN ?? ''"
        toolCallTimeoutMs: 30000
        # A missing/broken bridge must fail the boot instead of leaving the
        # assistant without tools (silent tool-less answers were the default).
        failOnStartupError: true
